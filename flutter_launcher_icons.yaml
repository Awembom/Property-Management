# App icon (designed 2026-10-03, drawn from assets/branding). Regenerate after
# changing the pictures:  dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/icon.png"
  # Android 8+ "adaptive" icon: phones cut it into a circle, squircle...
  adaptive_icon_background: "assets/branding/icon_background.png"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  min_sdk_android: 21
